name: Fetch Garmin Trail Runs & Generate Plot

on:
  workflow_dispatch:
  schedule:
    # Runs at 00:00 (midnight) UTC every Monday (1), Wednesday (3), and Saturday (6)
    - cron: '0 0 * * 1,3,6'

permissions:
  contents: write

jobs:
  run-garmin-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas garminconnect matplotlib numpy

      - name: Run Garmin Plot Script
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/running-plot.py

      - name: Commit and Push Plot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/public/images/running-plot-auto.png
          # Commits without [skip ci] so the VitePress action is triggered
          git diff --staged --quiet || git commit -m "chore: update running plot image"
          git push
